[plugin]
name = "variant-log-plugin"
version = "0.10.0"
description = "Example plugin that identifies its build variant for testing"
authors = ["rustbridge team"]

[messages."identify"]
description = "Return the build variant of this plugin"

[platforms]
linux-x86_64 = "libvariant_log_plugin.so"
linux-aarch64 = "libvariant_log_plugin.so"
darwin-x86_64 = "libvariant_log_plugin.dylib"
darwin-aarch64 = "libvariant_log_plugin.dylib"
windows-x86_64 = "variant_log_plugin.dll"
